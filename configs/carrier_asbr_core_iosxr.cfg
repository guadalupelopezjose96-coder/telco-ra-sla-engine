!! ========================================================================================
!! CONFIGURACIÓN MAESTRA CARRIER-GRADE ASBR / CORE ROUTER (CISCO IOS-XR 24.x)
!! CONTROLES CUBIERTOS: ARC-01, ARC-03, ARC-04, OPS-01 a OPS-05, SEC-01 a SEC-04
!! ========================================================================================
hostname MAD-CORE-ASBR-01
clock timezone UTC 0

!! --- 1. PLANO DE GESTIÓN FUERA DE BANDA (OOBM) Y HARDENING (ARC-01, SEC-01, SEC-02) ---
vrf MGMT-OOBM
 address-family ipv4 unicast
 !
 address-family ipv6 unicast
 !
!
!! Desactivación absoluta de protocolos inseguros en texto claro (CIS / DISA STIG)
no service pad
no telnet ipv4 server
no telnet ipv6 server
no http server
no ftp server
no tftp server
no snmp-server community

!! Autenticación centralizada AAA sobre TACACS+ con TLS 1.3 (RadSec/TACACS-TLS) + PAM FIDO2
aaa accounting exec default start-stop group TACACS-TLS-CLUSTER
aaa accounting commands default start-stop group TACACS-TLS-CLUSTER
aaaaccounting system default start-stop group TACACS-TLS-CLUSTER
aaa authorization exec default group TACACS-TLS-CLUSTER
aaa authorization commands default group TACACS-TLS-CLUSTER
aaa authentication login default group TACACS-TLS-CLUSTER

tacacs source-interface MgmtEth0/RP0/CPU0/0
aaa group server tacacs+ TACACS-TLS-CLUSTER
 vrf MGMT-OOBM
 server-private 10.254.0.10 port 4949
  tls
   trustpoint PKI-INTERNAL-PQC-CA
  !
 !
 server-private 10.254.0.11 port 4949
  tls
   trustpoint PKI-INTERNAL-PQC-CA
  !
 !
!

ssh server v2
ssh server vrf MGMT-OOBM netconf-vrf-table
ssh server algorithms kex ecdh-sha2-nistp521
ssh server algorithms cipher aes256-gcm@openssh.com
ssh server algorithms mac hmac-sha2-512-etm@openssh.com
ssh server certificate-authentication
ssh timeout 60

netconf-yang agent
 ssh
!

!! Logs forenses hacia colector WORM sobre TLS 1.3 (RFC 5425 - Control SEC-04)
logging tls-server WORM-SIEM-COLLECTOR
 vrf MGMT-OOBM
 address ipv4 10.254.10.50 port 6514
 trustpoint PKI-INTERNAL-PQC-CA
 severity debugging
!
logging archive
 device harddisk
 severity debugging
 file-size 100
 archive-length 52
!

!! --- 2. CIFRADO DE CAPA DE ENLACE MACsec 802.1AE GCM-AES-XPN-256 (SEC-01) ---
macsec-policy POLICY-CARRIER-XPN-256
 cipher-suite gcm-aes-xpn-256
 key-server-priority 16
 conf-offset CONF-OFFSET-0
 security-policy must-secure
 window-size 1024
 sak-rekey-interval 3600
!

!! --- 3. SINCRONIZACIÓN DE FRECUENCIA (SyncE G.8262) Y FASE (PTP G.8275.1 - OPS-04) ---
frequency synchronization
 quality itu-t option 1 generation 2
 clock-interface timing-mode system
 log selection changes
!
ptp
 clock
  domain 24
  profile g.8275.1 clock-type T-BC
 !
 profile PROFILE-TELECOM-G8275-1
  transport ethernet
  sync frequency 16
  announce frequency 8
  delay-request frequency 16
  local-priority 128
 !
 physical-layer-frequency
!

!! --- 4. PROTECCIÓN DE CPU EN HARDWARE ASIC (CoPP / LPTS - Control SEC-02) ---
lpts pifib hardware police
 flow bgp-known rate 25000
 flow bgp-cfg-peer rate 5000
 flow bgp-default rate 0
 flow isis-known rate 15000
 flow isis-default rate 0
 flow bfd-known rate 50000
 flow bfd-default rate 0
 flow ssh-known rate 2000
 flow ssh-default rate 500
 flow icmp-local rate 500
 flow arp-request rate 500
 flow fragment rate 0
 flow ip-options rate 0
!

!! --- 5. POLÍTICAS DE CALIDAD DE SERVICIO (QoS DiffServ 6 Colas - Control OPS-03) ---
class-map match-any CM-NC-SYNC-CS6
 match dscp cs6 cs7
 match mpls experimental topmost 6 7
 end-class-map
!
class-map match-any CM-VOICE-EF
 match dscp ef
 match mpls experimental topmost 5
 end-class-map
!
class-map match-any CM-SIGNALING-AF31
 match dscp af31 cs3
 match mpls experimental topmost 3
 end-class-map
!
class-map match-any CM-CRITICAL-DATA-AF41
 match dscp af41 af21
 match mpls experimental topmost 4
 end-class-map
!
class-map match-any CM-VPN-ENTERPRISE-AF11
 match dscp af11
 match mpls experimental topmost 2
 end-class-map
!

policy-map PM-CORE-EGRESS-DIFFSERV
 class CM-NC-SYNC-CS6
  priority level 1
  police rate percent 5
 !
 class CM-VOICE-EF
  priority level 2
  police rate percent 20
 !
 class CM-SIGNALING-AF31
  bandwidth remaining percent 20
  queue-limit 50 ms
 !
 class CM-CRITICAL-DATA-AF41
  bandwidth remaining percent 30
  random-detect dscp af41 40 ms 80 ms
 !
 class CM-VPN-ENTERPRISE-AF11
  bandwidth remaining percent 25
  random-detect dscp af11 50 ms 100 ms
 !
 class class-default
  bandwidth remaining percent 25
  random-detect default
 !
 end-policy-map
!

!! --- 6. INTERFACES TRONCALES 400G ZR+ Y PEERING (ARC-01, OPS-05, SEC-01, SEC-02) ---
interface MgmtEth0/RP0/CPU0/0
 description OOBM-ISOLATED-ZERO-TRUST-MANAGEMENT
 vrf MGMT-OOBM
 ipv4 address 10.254.1.11 255.255.255.0
 ipv6 address fd00:1979:oobm::11/64
 no cdp
 no lldp
!
interface FourHundredGigE0/0/0/0
 description CORE-TRUNK-TO-BCN-CORE-01-PATH-A-MAX-LOAD-42PCT
 mtu 9216
 macsec psk-keychain KC-MACSEC-CORE policy POLICY-CARRIER-XPN-256
 service-policy output PM-CORE-EGRESS-DIFFSERV
 ipv6 address 2001:db8:1979:core::1/127
 frequency synchronization
  selection input
  priority 10
  wait-to-restore 5
  ssm disable
 !
 ptp
  profile PROFILE-TELECOM-G8275-1
 !
 load-interval 30
!
interface FourHundredGigE0/0/0/1
 description EXTERNAL-IXP-PEERING-NNI-PDR-01
 mtu 9216
 service-policy output PM-CORE-EGRESS-DIFFSERV
 ipv4 address 198.51.100.1 255.255.255.252
 ipv6 address 2001:db8:1979:peering::1/126
 !! Prevención de IP Spoofing (BCP 38 / RFC 2827 - Control ARC-04 / SEC-02)
 ipv4 verify unicast source reachable-via rx
 ipv6 verify unicast source reachable-via rx
 ipv4 access-group IACL-PROTECT-INFRASTRUCTURE ingress
 ipv6 access-group IACL-PROTECT-INFRASTRUCTURE-V6 ingress
 flow ipv4 monitor IPFIX-MONITOR-MAP sampler SAMPLER-1-IN-1000 ingress
 flow ipv6 monitor IPFIX-MONITOR-MAP-V6 sampler SAMPLER-1-IN-1000 ingress
!

!! --- 7. BFD EN HARDWARE (3.3ms x 3) + IS-IS + SRv6 + TI-LFA < 15ms (ARC-01) ---
bfd
 multipath include location 0/0/CPU0
!
segment-routing
 srv6
  encapsulation
   source-address 2001:db8:1979:loop0::1
  !
  locators
   locator LOC-CORE-LOW-LATENCY
    micro-segment behavior unode psp-usd
    prefix 2001:db8:1979:srv6::/48
   !
  !
 !
!
router isis CORE-IGP
 is-type level-2-only
 net 49.0001.1979.0000.0001.00
 nsr
 nsf ietf
 log adjacency changes
 lsp-gen-interval maximum-wait 5000 initial-wait 10 secondary-wait 50
 spf-interval maximum-wait 2000 initial-wait 10 secondary-wait 50
 authentication-type hmac-sha-256
 authentication-keychain KC-ISIS-SHA256
 address-family ipv6 unicast
  metric-style wide
  microloop avoidance segment-routing
  rib-update-delay 5000
  segment-routing srv6
   locator LOC-CORE-LOW-LATENCY
  !
 !
 interface FourHundredGigE0/0/0/0
  point-to-point
  hello-padding disable
  bfd minimum-interval 3
  bfd multiplier 3
  bfd fast-detect ipv6
  address-family ipv6 unicast
   fast-reroute per-prefix
   fast-reroute per-prefix ti-lfa
   fast-reroute per-prefix tiebreaker node-protecting index 10
    fast-reroute per-prefix tiebreaker srlg-disjoint index 20
   metric 100
  !
 !
!

!! --- 8. SEGURIDAD BGP, RPKI RTR (RFC 8210), FLOWSPEC Y GRACEFUL SHUTDOWN (ARC-04, OPS-02, SEC-03) ---
prefix-set PS-BOGONS-V4
  0.0.0.0/8 le 32,
  10.0.0.0/8 le 32,
  100.64.0.0/10 le 32,
  127.0.0.0/8 le 32,
  169.254.0.0/16 le 32,
  172.16.0.0/12 le 32,
  192.0.2.0/24 le 32,
  192.168.0.0/16 le 32,
  198.18.0.0/15 le 32,
  224.0.0.0/3 le 32
end-set
!
prefix-set PS-BOGONS-V6
  ::/8 le 128,
  100::/64 le 128,
  2001:db8::/32 le 128,
  fc00::/7 le 128,
  fe80::/10 le 128,
  ff00::/8 le 128
end-set
!

route-policy RP-EBGP-PEERING-IN
  !! 1. Descarte inmediato de prefijos RPKI Invalid (Control ARC-04)
  if validation-state is invalid then
    drop
  endif
  !! 2. Descarte de Bogons y prefijos demasiado específicos
  if destination in PS-BOGONS-V4 or destination in (0.0.0.0/0 ge 25) then
    drop
  endif
  !! 3. Soporte nativo para BGP Graceful Shutdown (RFC 8326 Com. 65535:0 - Control OPS-02)
  if community matches-any (65535:0) then
    set local-preference 0
  elseif validation-state is valid then
    set local-preference 200
  else
    set local-preference 100
  endif
  pass
end-policy
!

route-policy RP-EBGP-MAINTENANCE-DRAIN-OUT
  !! Activar antes de ventana ISSU para drenar tráfico con 0% de pérdida
  set community (65535:0) additive
  set as-path prepend 65001 65001 65001
  pass
end-policy
!

router bgp 65001
 bgp router-id 192.0.2.1
 bgp graceful-restart
 bgp graceful-restart-time 120
 nsr
 !! Validadores RPKI redundantes sobre RTR v2 + TLS (RFC 8210)
 rpki server 10.254.20.10
  transport ssh port 8283
  refresh-time 120
  response-time 30
  purge-time 300
 !
 rpki server 10.254.20.11
  transport ssh port 8283
  refresh-time 120
  response-time 30
  purge-time 300
 !
 bgp origin-as validation
  enable
  signal ibgp
 !
 address-family ipv4 unicast
  bgp Bestpath origin-as use validity
  additional-paths receive
  additional-paths send
  allocate-label all
 !
 address-family ipv6 unicast
  bgp bestpath origin-as use validity
  additional-paths receive
  additional-paths send
  segment-routing srv6
   locator LOC-CORE-LOW-LATENCY
  !
 !
 !! Mitigación DDoS automatizada en < 3 segundos (BGP Flowspec RFC 8955 - Control SEC-03)
 address-family ipv4 flowspec
 !
 address-family ipv6 flowspec
 !
 neighbor 198.51.100.2
  remote-as 65500
  description EXTERNAL-PEER-AS65500-MANRS-COMPLIANT
  !! Autenticación TCP-AO (RFC 5925) y GTSM TTL Security (RFC 5082)
  tcp-ao KC-BGP-TCP-AO include-tcp-options
  ebgp-multihop 1
  ttl-security
  bfd fast-detect
  bfd minimum-interval 10
  bfd multiplier 3
  address-family ipv4 unicast
   route-policy RP-EBGP-PEERING-IN in
   maximum-prefix 250000 80 warning-only
   next-hop-self
  !
 !
!

!! --- 9. TELEMETRÍA CONTINUA gNMI / MODEL-DRIVEN TELEMETRY E IPFIX (OPS-01) ---
telemetry model-driven
 destination-group DG-KAFKA-GNMI-COLLECTORS
  vrf MGMT-OOBM
  address-family ipv4 10.254.30.100 port 57400
   encoding self-describing-gpb
   protocol grpc tls-hostname gnmi.collector.internal
  !
 !
 sensor-group SG-QOS-MICROBURSTS-1S
  sensor-path Cisco-IOS-XR-qos-ma-oper:qos/nodes/node/policy-map/interface-table/interface/output/service-policy-names/service-policy-instance/statistics
 !
 sensor-group SG-OPTICAL-DWDM-5S
  sensor-path Cisco-IOS-XR-controller-optics-oper:optics-oper/optics-ports/optics-port/optics-info
 !
 sensor-group SG-ROUTING-BFD-ONCHANGE
  sensor-path openconfig-bfd:bfd/interfaces/interface/peers/peer/state
  sensor-path openconfig-network-instance:network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state
 !
 subscription SUB-CARRIER-SLA-99999
  sensor-group-id SG-QOS-MICROBURSTS-1S sample-interval 1000
  sensor-group-id SG-OPTICAL-DWDM-5S sample-interval 5000
  sensor-group-id SG-ROUTING-BFD-ONCHANGE sample-interval 0
  destination-id DG-KAFKA-GNMI-COLLECTORS
  source-interface MgmtEth0/RP0/CPU0/0
 !
!

!! Reflector TWAMP (RFC 5357) en hardware para certificación SLA (Control OPS-01)
ipsla
 responder
  twamp
   timeout 300
  !
 !
 server twamp
  port 862
  inactivity-timer 100
 !
!
end
