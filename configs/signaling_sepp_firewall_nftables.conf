#!/usr/sbin/nft -f
# ========================================================================================
# FIREWALL PERIMETRAL DE SEÑALIZACIÓN TELECOM (5G SEPP / SBC / DIAMETER / GTP / SS7)
# ALINEADO CON GSMA FS.11, FS.19, FS.31 Y CONTROLES SEC-01, SEC-02, SEC-03
# ========================================================================================
flush ruleset

table inet telco_signaling_perimeter {
    # Lista autorizada de direcciones IP de operadores Roaming IPX / Peering validados
    set trusted_ipx_roaming_peers {
        type ipv4_addr
        flags interval
        elements = { 198.51.100.0/24, 203.0.113.0/24 }
    }

    # Lista de Nodos de Gestión Fuera de Banda (Bastión PAM + Colectores gNMI)
    set oobm_zero_trust_controllers {
        type ipv4_addr
        elements = { 10.254.0.10, 10.254.0.11, 10.254.30.100 }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        # 1. Permitir loopback e interfaces internas de estado verificado
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # 2. Bloqueo estricto de protocolos administrativos en texto claro (Control SEC-02)
        tcp dport { 21, 23, 80, 69 } counter drop comment "DROP-CLEARTEXT-FTP-TELNET-HTTP-TFTP"
        udp dport { 69, 161, 162 } counter drop comment "DROP-LEGACY-TFTP-SNMP"

        # 3. Acceso Administrativo SSH/NETCONF/gNMI exclusivo desde VRF OOBM + Bastión PAM
        iifname "mgmt0" ip saddr @oobm_zero_trust_controllers tcp dport { 22, 830, 9339 } ct state new meter adm_rate { ip saddr limit rate 30/minute } accept

        # 4. Protección de Señalización 5G SEPP (N32-c / N32-f sobre mTLS 1.3 - GSMA FS.31)
        ip saddr @trusted_ipx_roaming_peers tcp dport 8443 ct state new meter sepp_rate { ip saddr limit rate 500/second burst 1000 packets } accept

        # 5. Protección Diameter (S6a/Ro/Gy - Puerto 3868 SCTP/TCP - GSMA FS.19)
        ip saddr @trusted_ipx_roaming_peers meta l4proto { tcp, sctp } th dport 3868 meter diam_rate { ip saddr limit rate 1000/second } accept

        # 6. Protección SS7 SIGTRAN M3UA (Puerto 2905 SCTP - GSMA FS.11)
        ip saddr @trusted_ipx_roaming_peers meta l4proto sctp th dport 2905 meter ss7_rate { ip saddr limit rate 400/second } accept

        # 7. Protección SIP sobre TLS 1.3 (Puerto 5061 en SBC con STIR/SHAKEN)
        tcp dport 5061 ct state new meter sip_tls_rate { ip saddr limit rate 250/second burst 500 packets } accept

        # 8. Protección de Túneles GTP-C (2123) y GTP-U (2152) en Roaming N9/S8
        ip saddr @trusted_ipx_roaming_peers udp dport { 2123, 2152 } accept

        # 9. Sincronización PTP IEEE 1588v2 (Puertos 319 Evento, 320 General) y Sondeo TWAMP (862)
        udp dport { 319, 320, 862 } accept

        # Registro forense y descarte por defecto (Zero Trust)
        limit rate 10/second log prefix "[SEC-03-SIGNALING-DROP] " level warn
        counter drop
    }
}
